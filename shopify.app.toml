# AMPER Live Assisted Sales - Shopify app configuration.
# The app "backend" is las-backend (Django); this project holds only the app config and
# the storefront extensions, so `shopify app deploy` here never touches the server code.
#
# client_id comes from the company Partner account's Dev Dashboard (see the owner setup
# instruction in the main repo). Replace the placeholder before the first deploy, or run
# `shopify app config link` to have the CLI fill it in.
#
# In dev, replace https://live-assisted-sales.com with the tunnel host in front of :8001
# (and mirror the same value in las-backend's SHOPIFY_PUBLIC_BASE_URL) - `shopify app dev`
# can also manage these URLs for you automatically.

client_id = "9e76195cb531053afedbc0b57927a218"
name = "AMPER Live Assisted Sales"
handle = "amper-live-assisted-sales"
application_url = "https://live-assisted-sales.com/integrations/shopify/install/"
# No embedded admin UI in phase 1: the app's console IS the LAS console, and install/
# connect run as top-level redirects. Revisit (App Bridge + embedded = true) before an
# App Store submission, where embedded admin is the expected experience.
embedded = false

[access_scopes]
# read_orders: orders/create webhook (purchase events). read_checkouts: checkouts/create
# webhook (ad-blocker-proof begin_checkout). write_pixels: activate the Web Pixel on
# connect (webPixelCreate). read_customers: e-mail for signed chat identity via the app
# proxy (works without approval on dev stores; real merchant stores need
# protected-customer-data access granted in the Partner Dashboard).
# read_products: the agent's chat product search asks the Admin API for the shop's whole
# catalogue, so an agent can send a product nobody has viewed yet. Shops installed before this
# scope existed keep working - their picker falls back until the merchant re-authorises.
scopes = "read_orders,read_checkouts,write_pixels,read_customers,read_customer_events,read_products"

[auth]
redirect_urls = ["https://live-assisted-sales.com/integrations/shopify/oauth/callback/"]

[webhooks]
api_version = "2026-07"

# App-specific (declarative) subscriptions: Shopify delivers these for EVERY shop that
# has the app installed - no per-shop API registration involved. The per-shop
# webhookSubscriptionCreate in las-backend stays as belt-and-braces; duplicate deliveries
# dedupe on event_id at ingest.
[[webhooks.subscriptions]]
topics = ["orders/create", "checkouts/create", "app/uninstalled"]
uri = "https://live-assisted-sales.com/api/integrations/shopify/webhooks/"

# The three mandatory GDPR topics are configured here (not via the API); business topics
# (orders/create, app/uninstalled) are registered per shop by las-backend on connect.
[webhooks.privacy_compliance]
customer_data_request_url = "https://live-assisted-sales.com/api/integrations/shopify/webhooks/"
customer_deletion_url = "https://live-assisted-sales.com/api/integrations/shopify/webhooks/"
shop_deletion_url = "https://live-assisted-sales.com/api/integrations/shopify/webhooks/"

# Storefront calls /apps/las/... on the shop's own domain; Shopify proxies them to
# las-backend with a verifiable signature and logged_in_customer_id. Used for the signed
# chat identity (see las-backend apps/live/shopify_views.shopify_proxy_identity).
[app_proxy]
url = "https://live-assisted-sales.com/api/shopify/proxy/"
prefix = "apps"
subpath = "las"

[pos]
embedded = false
