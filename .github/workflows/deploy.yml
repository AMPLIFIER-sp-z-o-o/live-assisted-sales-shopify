# Deploy the app configuration + extensions to Shopify on every push to main that touches
# them - the Shopify counterpart of the WordPress plugin's push-to-main release flow, with
# one difference: server code (las-backend) deploys itself; this pipeline only ships the
# extension layer, which Shopify versions and propagates to shops within minutes.
#
# Requires the SHOPIFY_APP_AUTOMATION_TOKEN secret: Dev Dashboard -> the app -> Settings
# -> "Create automation token" (expires after the chosen window - 6 months by default, so
# it needs re-issuing). Without the secret the job fails fast and nothing is shipped.
name: Deploy Shopify app

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "shopify.app.toml"

concurrency:
  group: shopify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm install
      - name: Deploy app version
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        # No ": " inside this unquoted scalar - YAML would read it as a mapping and the
        # whole workflow file becomes invalid (runs then fail with zero jobs).
        run: npx shopify app deploy --force --message "ci ${{ github.sha }}"
