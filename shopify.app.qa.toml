# AMPER LAS (QA) - the QA-environment twin of shopify.app.toml. Same extensions, same
# scopes; every URL points at qa.live-assisted-sales.com and the credentials belong to
# the separate "AMPER LAS (QA)" app (id 403816415233), so QA experiments can never touch
# the production app. Deploy with: npx shopify app deploy --config qa

client_id = "bab4e4013194deaea7f78441a829080c"
name = "AMPER LAS (QA)"
handle = "amper-las-qa"
application_url = "https://qa.live-assisted-sales.com/integrations/shopify/install/"
embedded = false

[access_scopes]
# read_products: the agent's chat product search asks the Admin API for the shop's whole
# catalogue, so an agent can send a product nobody has viewed yet. Shops installed before this
# scope existed keep working - their picker falls back until the merchant re-authorises.
scopes = "read_orders,read_checkouts,write_pixels,read_customers,read_customer_events,read_products"

[auth]
redirect_urls = ["https://qa.live-assisted-sales.com/integrations/shopify/oauth/callback/"]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["orders/create", "checkouts/create", "app/uninstalled"]
uri = "https://qa.live-assisted-sales.com/api/integrations/shopify/webhooks/"

[webhooks.privacy_compliance]
customer_data_request_url = "https://qa.live-assisted-sales.com/api/integrations/shopify/webhooks/"
customer_deletion_url = "https://qa.live-assisted-sales.com/api/integrations/shopify/webhooks/"
shop_deletion_url = "https://qa.live-assisted-sales.com/api/integrations/shopify/webhooks/"

[app_proxy]
url = "https://qa.live-assisted-sales.com/api/shopify/proxy/"
prefix = "apps"
subpath = "las"

[pos]
embedded = false
